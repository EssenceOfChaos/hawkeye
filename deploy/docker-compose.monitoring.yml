# HawkEye's own alerting, added on top of docker-compose.prod.yml: Prometheus evaluates deploy/prometheus-alerts.yml, and Alertmanager sends
# pages and tickets to Telegram and pings a healthchecks.io watchdog. scripts/deploy.sh includes this file whenever it exists.
#
#   docker compose --env-file .env.production -f deploy/docker-compose.prod.yml -f deploy/docker-compose.local-db.yml \
#     -f deploy/docker-compose.monitoring.yml up -d
#
# Settings (all optional; without them the alerts are still evaluated, and Alertmanager's log says what is not delivered):
#   ALERTS_TELEGRAM_BOT_TOKEN, ALERTS_TELEGRAM_CHAT_ID, ALERTS_WATCHDOG_URL. See docs/operations.md#alerting-and-external-monitoring.
# Nothing is published on the host. scripts/alerts.sh tests the path, lists what fires, and silences (acknowledges) an alert.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/rules/hawkeye.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      backend: {}      # the API's metrics (:9091)
      checks:          # the worker's metrics (:9090); a fixed address so the egress filter can let exactly this container in
        ipv4_address: 172.30.10.6
      alerting: {}     # Alertmanager
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    mem_limit: 384m
    cpus: 0.5

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    # Only these settings, not the whole .env.production: Alertmanager needs nothing else.
    environment:
      ALERTS_TELEGRAM_BOT_TOKEN: ${ALERTS_TELEGRAM_BOT_TOKEN:-}
      ALERTS_TELEGRAM_CHAT_ID: ${ALERTS_TELEGRAM_CHAT_ID:-}
      ALERTS_WATCHDOG_URL: ${ALERTS_WATCHDOG_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager   # silences survive a restart
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Its own network: it needs the internet (Telegram, healthchecks.io) and nothing else.
    networks: [alerting]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    mem_limit: 128m
    cpus: 0.25

networks:
  alerting: {}

volumes:
  prometheus_data: {}
  alertmanager_data: {}
