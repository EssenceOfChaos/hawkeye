# Prometheus alerting rules for HawkEye. In production, deploy/docker-compose.monitoring.yml runs Prometheus with this file (it scrapes the API on
# :9091 and the worker on :9090, private ports never published) and Alertmanager, which sends severity page and ticket alerts to Telegram.
# Pair these with an EXTERNAL uptime check on https://<your-domain>/readyz from a different provider/region: this service must not be the only
# thing that can notice its own outage. Thresholds assume the default settings; tune them to your plans' check intervals.
groups:
  - name: hawkeye-api
    rules:
      - alert: HawkEyeApiHighErrorRate
        expr: sum(rate(hawkeye_http_requests_total{code=~"5.."}[5m])) / clamp_min(sum(rate(hawkeye_http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels: {severity: page}
        annotations: {summary: "More than 5% of API requests fail with 5xx", runbook: "docs/operations.md#api-errors"}
      - alert: HawkEyeApiSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(hawkeye_http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels: {severity: ticket}
        annotations: {summary: "API p95 latency above 2 s", runbook: "docs/operations.md#api-errors"}
      - alert: HawkEyeApiPanics
        expr: increase(hawkeye_http_panics_total[15m]) > 0
        labels: {severity: ticket}
        annotations: {summary: "A request handler panicked (also reported to the error tracker)"}
      - alert: HawkEyeOAuthTokenThrottled
        expr: increase(hawkeye_rate_limited_total{scope="oauth-token"}[10m]) > 0
        labels: {severity: ticket}
        annotations: {summary: "OAuth token or revocation requests are being refused by the per-IP limit; Claude users may fail to connect or stay connected", runbook: "docs/operations.md#oauth-clients-connecting-claude"}
      - alert: HawkEyeRateLimiterFailing
        expr: increase(hawkeye_rate_limiter_errors_total[10m]) > 0
        labels: {severity: ticket}
        annotations: {summary: "The shared rate limiter's database is failing: limits are being skipped (fail-open)"}
      - alert: HawkEyeSecurityLogWritesFailing
        expr: increase(hawkeye_audit_writes_total{outcome="error"}[15m]) > 0
        labels: {severity: ticket}
        annotations: {summary: "Changes are being made but some are missing from the security log", runbook: "docs/operations.md#security-log-writes-failing"}
      # The free checkers (SSL certificate checker, website status checker: POST /api/v1/tools/{ssl,site}-check) are public and connect out to hosts
      # visitors name. Ordinary use is a trickle; these fire on sustained volume, on people being turned away, and on bots running into the per-IP
      # limits. If they fire: look at the `ssl check` / `site check` log lines, and consider a bot challenge (docs/operations.md#free-tools-abuse and docs/security-review.md, item 12).
      - alert: HawkEyeFreeCheckersHeavyUse
        expr: sum(rate(hawkeye_http_requests_total{route=~"/api/v1/tools/(ssl|site)-check"}[10m])) > 0.5
        for: 15m
        labels: {severity: ticket}
        annotations: {summary: "The free checkers are averaging more than one request every 2 seconds: a traffic spike or abuse", runbook: "docs/operations.md#free-tools-abuse"}
      - alert: HawkEyeFreeCheckersTurningPeopleAway
        expr: sum(rate(hawkeye_http_requests_total{route=~"/api/v1/tools/(ssl|site)-check",code=~"503|429"}[10m])) > 0.1
        for: 15m
        labels: {severity: ticket}
        annotations: {summary: "The free checkers are refusing a steady share of requests (busy, or clients hitting their limits)", runbook: "docs/operations.md#free-tools-abuse"}
      - alert: HawkEyeFreeCheckersClientsThrottled
        expr: sum(rate(hawkeye_rate_limited_total{scope=~"route:(ssl|site)-check|(ssl|site)-check:hour"}[10m])) > 0.05
        for: 15m
        labels: {severity: ticket}
        annotations: {summary: "Clients keep hitting the free checkers' per-IP limits: probably a script", runbook: "docs/operations.md#free-tools-abuse"}
      - alert: HawkEyeDbPoolSaturated
        expr: hawkeye_db_pool_acquired_connections >= hawkeye_db_pool_max_connections
        for: 5m
        labels: {severity: ticket}
        annotations: {summary: "Every database connection is in use: raise DB_MAX_CONNS or investigate slow queries"}
      - alert: HawkEyeDbPoolWaiting
        expr: rate(hawkeye_db_pool_empty_acquires_total[5m]) > 1
        for: 10m
        labels: {severity: ticket}
        annotations: {summary: "Requests regularly wait for a database connection (pool pressure)"}

  - name: hawkeye-monitoring-engine
    # The API process exports the worker's gauges too (internal/metrics/api.go shares one set), but never sets them: there they stay 0, which reads as
    # "never polled", "retention never ran" and "canary down". Rules on those gauges must look only at job="worker".
    rules:
      - alert: HawkEyeWorkerNotPolling
        expr: time() - max(hawkeye_worker_last_poll_timestamp_seconds{job="worker"}) > 120
        for: 2m
        labels: {severity: page}
        annotations: {summary: "No worker has polled the queue for 2 minutes: monitoring is NOT running", runbook: "docs/operations.md#checks-are-not-running"}
      - alert: HawkEyeSchedulerLag
        expr: hawkeye_scheduler_lag_seconds > 180
        for: 5m
        labels: {severity: page}
        annotations: {summary: "Monitors are overdue by more than 3 minutes (scheduler stopped or workers saturated)", runbook: "docs/operations.md#checks-are-not-running"}
      - alert: HawkEyeQueueBacklog
        expr: hawkeye_queue_oldest_job_age_seconds > 300
        for: 5m
        labels: {severity: page}
        annotations: {summary: "The oldest queued check has waited over 5 minutes: add workers or raise WORKER_CONCURRENCY"}
      - alert: HawkEyeQueueBackpressure
        expr: increase(hawkeye_scheduler_backpressure_total[10m]) > 0
        labels: {severity: ticket}
        annotations: {summary: "The queue reached QUEUE_MAX_DEPTH and the scheduler stopped enqueuing"}
      - alert: HawkEyeMissedChecks
        expr: increase(hawkeye_scheduler_missed_checks_total[15m]) > 0
        labels: {severity: ticket}
        annotations: {summary: "Checks ran a full interval late (the engine was down or behind)"}
      - alert: HawkEyeJobsDropped
        expr: increase(hawkeye_jobs_dropped_total[15m]) > 0
        labels: {severity: ticket}
        annotations: {summary: "Check jobs exhausted their attempts and were dropped (workers crashing mid-check?)"}
      - alert: HawkEyeWorkerErrors
        expr: sum(rate(hawkeye_worker_errors_total[10m])) > 0.1
        for: 10m
        labels: {severity: ticket}
        annotations: {summary: "Sustained internal worker errors (database trouble?)"}
      - alert: HawkEyeCredentialsUnreadable
        expr: increase(hawkeye_worker_errors_total{stage="secrets"}[15m]) > 0
        labels: {severity: page}
        annotations: {summary: "Monitors with stored credentials are not being checked: the encryption key is missing or wrong", runbook: "docs/operations.md#stored-credentials-cannot-be-opened"}
      - alert: HawkEyeMostChecksFailing
        expr: sum(rate(hawkeye_checks_total{result="failure"}[10m])) / clamp_min(sum(rate(hawkeye_checks_total[10m])), 0.001) > 0.5
        for: 10m
        labels: {severity: page}
        annotations: {summary: "Over half of all checks fail: suspect OUR network/DNS/egress, not thousands of customer sites"}
      - alert: HawkEyeRetentionStale
        expr: time() - max(hawkeye_retention_last_success_timestamp_seconds{job="worker"}) > 10800
        for: 10m
        labels: {severity: ticket}
        annotations: {summary: "Data retention has not completed for 3 hours: the database will keep growing", runbook: "docs/operations.md#database-growing"}
      - alert: HawkEyeDomainLookupsFailing
        expr: sum(increase(hawkeye_domain_lookups_total{result="error"}[6h])) > 20 and sum(increase(hawkeye_domain_lookups_total{result="error"}[6h])) > sum(increase(hawkeye_domain_lookups_total{result=~"known|unavailable"}[6h]))
        for: 30m
        labels: {severity: ticket}
        annotations: {summary: "Most domain expiry lookups are failing: a registry, IANA, or the worker's network (customers keep the last date HawkEye saw)", runbook: "docs/operations.md#domain-expiry-is-missing-or-wrong"}

  - name: hawkeye-notifications-and-billing
    rules:
      - alert: HawkEyeAlertEmailBacklog
        expr: hawkeye_notification_oldest_pending_seconds > 300
        for: 5m
        labels: {severity: page}
        annotations: {summary: "Outage alerts are waiting more than 5 minutes to be sent (email provider or dispatcher down)", runbook: "docs/operations.md#alerts-are-not-arriving"}
      - alert: HawkEyeAlertEmailFailing
        expr: sum(increase(hawkeye_notification_deliveries_total{result=~"retry|failed"}[15m])) > 3
        labels: {severity: page}
        annotations: {summary: "Alert emails are failing or being retried repeatedly", runbook: "docs/operations.md#alerts-are-not-arriving"}
      - alert: HawkEyeBillingEventFailed
        expr: hawkeye_billing_events_failed > 0
        labels: {severity: page}
        annotations: {summary: "A billing webhook event gave up: a customer's plan may be wrong", runbook: "docs/billing.md#operations"}
      - alert: HawkEyeBillingBacklog
        expr: hawkeye_billing_oldest_pending_seconds > 600
        for: 5m
        labels: {severity: ticket}
        annotations: {summary: "Stored billing events are not being applied"}
      - alert: HawkEyeBillingSignatureFailures
        expr: increase(hawkeye_billing_webhook_events_total{result="invalid_signature"}[15m]) > 5
        labels: {severity: ticket}
        annotations: {summary: "Webhook signature failures: wrong STRIPE_WEBHOOK_SECRET after a roll, or someone probing the endpoint"}
      - alert: HawkEyeBillingRiskEvent
        expr: increase(hawkeye_billing_risk_events_total[1h]) > 0
        labels: {severity: page}
        annotations: {summary: "A dispute, refund or fraud warning needs human review in Stripe", runbook: "docs/billing.md"}
      - alert: HawkEyeCanaryImpaired
        expr: hawkeye_canary_up{job="worker"} == 0
        for: 3m
        labels: {severity: page}
        annotations: {summary: "A worker cannot reach independent public sites (its own network or DNS is down): check failures that look like network trouble are being discarded, so monitors are not being checked properly", runbook: "docs/operations.md#canary-our-own-network-is-down"}
      - alert: HawkEyeChecksDiscardedByCanary
        expr: sum(increase(hawkeye_checks_total{result="inconclusive"}[15m])) > 20
        labels: {severity: ticket}
        annotations: {summary: "Many check failures were discarded as inconclusive because the canary reported our network down", runbook: "docs/operations.md#canary-our-own-network-is-down"}
      - alert: HawkEyeBillingPriceMismatch
        expr: hawkeye_billing_price_mismatch == 1
        labels: {severity: page}
        annotations: {summary: "A plan's Stripe price does not match the price shown on the site; checkout for that plan is refused until they agree", runbook: "docs/billing.md#price-check"}

  # The alerting itself (deploy/docker-compose.monitoring.yml). A monitoring product must hear about its own monitoring breaking.
  - name: hawkeye-alerting
    rules:
      # Always fires while Prometheus evaluates rules and Telegram delivery works. Alertmanager turns it into a healthchecks.io ping about every
      # minute, so when Prometheus, Alertmanager or the bot breaks, the pings stop and healthchecks.io alerts through its own channels. A few
      # failed sends in 15 minutes (a bad token, a removed chat) stop it on purpose; a single retried blip does not.
      - alert: Watchdog
        expr: vector(1) unless on() (sum(increase(alertmanager_notifications_failed_total{integration="telegram"}[15m])) > 3)
        labels: {severity: none}
        annotations: {summary: "The alerting pipeline is working (this alert always fires; it is the dead-man's switch)"}
      - alert: HawkEyeMetricsUnreachable
        expr: up{job=~"api|worker|alertmanager"} == 0
        for: 5m
        labels: {severity: page}
        annotations: {summary: "Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }}: its alerts cannot fire", runbook: "docs/operations.md#metrics-unreachable"}
      - alert: HawkEyeMetricsMissing
        expr: absent(up{job="api"}) or absent(up{job="worker"})
        for: 5m
        labels: {severity: page}
        annotations: {summary: "Prometheus finds no {{ $labels.job }} container to scrape (stopped, or not on the expected network)", runbook: "docs/operations.md#metrics-unreachable"}
      - alert: HawkEyeAlertRulesFailing
        expr: increase(prometheus_rule_evaluation_failures_total[15m]) > 0
        labels: {severity: ticket}
        annotations: {summary: "Some alert rules fail to evaluate, so they cannot fire", runbook: "docs/operations.md#metrics-unreachable"}
