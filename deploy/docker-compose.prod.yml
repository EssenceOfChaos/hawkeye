# Production stack for a single host (or as the basis for an orchestrator). PostgreSQL is NOT included: use a managed database with
# automated backups (strongly recommended). For a small single-host install add deploy/docker-compose.local-db.yml
# (see docs/deployment.md for the caveats).
#
#   cp deploy/.env.production.example .env.production   # then fill it in
#   docker compose --env-file .env.production -f deploy/docker-compose.prod.yml up -d --build
name: hawkeye

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  # Applies schema migrations, then exits. api and worker start only after it succeeds.
  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    entrypoint: ["/usr/local/bin/migrate", "up"]
    env_file: ["${HAWKEYE_ENV_FILE:-../.env.production}"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.production}
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  api:
    <<: *hardening
    image: hawkeye-api:${APP_VERSION:-local}
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    env_file: ["${HAWKEYE_ENV_FILE:-../.env.production}"]
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      API_METRICS_PORT: "9091"
      TRUST_FORWARDED_FOR: "true" # behind Caddy only; never publish the API port directly
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [edge, backend]
    mem_limit: 512m
    cpus: 1.0
    # No published ports: only Caddy (same network) can reach :8080, and :9091 (metrics) is reachable only from inside the network.

  worker:
    <<: *hardening
    image: hawkeye-worker:${APP_VERSION:-local}
    build: { context: .., dockerfile: deploy/Dockerfile.worker }
    env_file: ["${HAWKEYE_ENV_FILE:-../.env.production}"]
    environment:
      APP_ENV: production
      WORKER_METRICS_PORT: "9090"
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Its own network with a fixed subnet so the host firewall can restrict what the checks can reach (deploy/egress-filter.sh).
    networks: [checks]
    mem_limit: 512m
    cpus: 1.0

  web:
    <<: *hardening
    image: hawkeye-web:${APP_VERSION:-local}
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS (your domain, or :80 for a local test)}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL (a contact address for certificate expiry notices)}
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes:
      - caddy_data:/data     # certificates: keep this volume or you will hit certificate rate limits
      - caddy_config:/config
    # Caddy needs to write only to /data, /config (volumes) and /tmp.
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]
    mem_limit: 256m

networks:
  edge: {}
  backend: {}
  checks:
    ipam:
      config:
        - subnet: 172.30.10.0/24

volumes:
  caddy_data: {}
  caddy_config: {}
