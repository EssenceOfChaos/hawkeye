# Local development stack. Run from the repo root via `make up` or:
#   docker compose -f deploy/docker-compose.yml up --build
name: hawkeye

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monitoring
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monitoring"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    entrypoint: ["/usr/local/bin/migrate", "up"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/monitoring?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      APP_ENV: development
      APP_PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/monitoring?sslmode=disable
      SESSION_SECRET: replace_with_a_secure_random_secret
      LOG_LEVEL: debug
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/monitoring?sslmode=disable
      SESSION_SECRET: replace_with_a_secure_random_secret
      LOG_LEVEL: debug
    ports:
      - "9090:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: node:22.12-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    ports:
      - "3000:3000"
    volumes:
      - ../web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
