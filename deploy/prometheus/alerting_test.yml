# Unit tests for the rules that watch the alerting itself (group hawkeye-alerting in deploy/prometheus-alerts.yml).
# Run with scripts/check-alerting.sh (CI does), which uses promtool from the pinned Prometheus image.
rule_files: [../prometheus-alerts.yml]
evaluation_interval: 1m

tests:
  # Healthy: the watchdog fires (and is what keeps healthchecks.io quiet); nothing else in the group does.
  - interval: 1m
    input_series:
      - {series: 'alertmanager_notifications_failed_total{integration="telegram",reason="other"}', values: '0x30'}
      - {series: 'up{job="api",instance="api:9091"}', values: '1x30'}
      - {series: 'up{job="worker",instance="worker:9090"}', values: '1x30'}
      - {series: 'up{job="alertmanager",instance="alertmanager:9093"}', values: '1x30'}
    alert_rule_test:
      - eval_time: 20m
        alertname: Watchdog
        exp_alerts:
          - exp_labels: {severity: none}
            exp_annotations: {summary: "The alerting pipeline is working (this alert always fires; it is the dead-man's switch)"}
      - {eval_time: 20m, alertname: HawkEyeMetricsUnreachable, exp_alerts: []}
      - {eval_time: 20m, alertname: HawkEyeMetricsMissing, exp_alerts: []}

  # Telegram keeps refusing (bad token, removed chat): the watchdog stops, so healthchecks.io raises the alarm Telegram cannot.
  - interval: 1m
    input_series:
      - {series: 'alertmanager_notifications_failed_total{integration="telegram",reason="clientError"}', values: '0x10 1 2 3 4 5 6x20'}
      - {series: 'alertmanager_notifications_failed_total{integration="webhook",reason="other"}', values: '0x30'}
    alert_rule_test:
      - {eval_time: 17m, alertname: Watchdog, exp_alerts: []}

  # One failed send that Alertmanager retried is a blip, not a broken pager: the watchdog keeps firing.
  - interval: 1m
    input_series:
      - {series: 'alertmanager_notifications_failed_total{integration="telegram",reason="serverError"}', values: '0x10 1x20'}
    alert_rule_test:
      - eval_time: 17m
        alertname: Watchdog
        exp_alerts:
          - exp_labels: {severity: none}
            exp_annotations: {summary: "The alerting pipeline is working (this alert always fires; it is the dead-man's switch)"}

  # The worker's metrics stop answering (for example the egress filter blocks the scrape): a page after 5 minutes.
  - interval: 1m
    input_series:
      - {series: 'up{job="api",instance="api:9091"}', values: '1x30'}
      - {series: 'up{job="worker",instance="172.30.10.2:9090"}', values: '1x5 0x25'}
    alert_rule_test:
      - {eval_time: 9m, alertname: HawkEyeMetricsUnreachable, exp_alerts: []}
      - eval_time: 12m
        alertname: HawkEyeMetricsUnreachable
        exp_alerts:
          - exp_labels: {severity: page, job: worker, instance: "172.30.10.2:9090"}
            exp_annotations:
              summary: "Prometheus cannot scrape worker at 172.30.10.2:9090: its alerts cannot fire"
              runbook: "docs/operations.md#metrics-unreachable"

  # No API container to discover at all: nothing reports up == 0, so absent() has to notice.
  - interval: 1m
    input_series:
      - {series: 'up{job="worker",instance="worker:9090"}', values: '1x30'}
    alert_rule_test:
      - eval_time: 10m
        alertname: HawkEyeMetricsMissing
        exp_alerts:
          - exp_labels: {severity: page, job: api}
            exp_annotations:
              summary: "Prometheus finds no api container to scrape (stopped, or not on the expected network)"
              runbook: "docs/operations.md#metrics-unreachable"
