name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monitoring_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/monitoring_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck (Go code and standard library)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (production dependencies must have no known high/critical issues)
        working-directory: web
        # npm falls back to a retired audit endpoint when a request to the current one fails, and that fallback always answers "400 Invalid package tree".
        # So one flaky registry response shows up as a lockfile error. Retry; a real finding fails all three attempts and still fails the job.
        run: |
          for attempt in 1 2 3; do
            npm audit --omit=dev --audit-level=high && exit 0
            echo "npm audit failed (attempt $attempt of 3)"
            sleep $((attempt * 20))
          done
          exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The scripts that deploy and that turn the secret manager into the server's settings. They run for real against a fake Infisical, a throwaway
  # git repository and stubs for docker, so a mistake in them fails here and not during a release.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  # Builds the production images, starts the production-like stack (real TLS via Caddy's internal CA, real SMTP STARTTLS, PostgreSQL)
  # and runs the post-deploy smoke test, including a full register -> verify -> monitor -> delete-account lifecycle.
  smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend, scripts]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: make smoke-up
      - name: Smoke test
        run: SMOKE_HTTP_BASE=http://localhost:8088 scripts/smoke.sh https://localhost:8443 --insecure --full smoke@hawkeye.test --mail-api http://localhost:8026
      - name: Show logs on failure
        if: failure()
        run: docker compose -p hawkeye-smoke logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: make smoke-down
