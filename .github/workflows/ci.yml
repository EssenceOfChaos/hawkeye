name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monitoring_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/monitoring_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck (Go code and standard library)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (production dependencies must have no known high/critical issues)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Builds the production images, starts the production-like stack (real TLS via Caddy's internal CA, real SMTP STARTTLS, PostgreSQL)
  # and runs the post-deploy smoke test, including a full register -> verify -> monitor -> delete-account lifecycle.
  smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: make smoke-up
      - name: Smoke test
        run: SMOKE_HTTP_BASE=http://localhost:8088 scripts/smoke.sh https://localhost:8443 --insecure --full smoke@hawkeye.test --mail-api http://localhost:8026
      - name: Show logs on failure
        if: failure()
        run: docker compose -p hawkeye-smoke logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: make smoke-down
